name: feelings ping

on:
  schedule:
    # GitHub понимает только UTC, а окно нужно по Дублину (летом UTC+1, зимой UTC+0).
    # Поэтому дёргаем с запасом 08:00-20:45 UTC, а send.py сам отсекает всё,
    # что вне 09:00-21:00 по Дублину.
    - cron: "0,15,30,45 8-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить сразу, не глядя на расписание"
        type: boolean
        default: false

concurrency:
  group: feelings-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python send.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ_NAME: Europe/Dublin
          FORCE: ${{ inputs.force }}
